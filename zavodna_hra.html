<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Závodná hra</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      background: #111;
      color: white;
    }

    #hud {
      margin: 10px auto;
      max-width: 400px;
      display: flex;
      justify-content: space-around;
      font-size: 18px;
      color: white;
    }

    canvas {
      background: #333;
      display: block;
      margin: 10px auto;
      border: 2px solid black;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 10px;
    }
  </style>
</head>
<body>

  <div id="hud">
    <div id="score">Skóre: 0</div>
    <div id="lives">Životy: 3</div>
    <div id="level">Úroveň: 1</div>
    <div id="nextLevel">→ za 10s</div>
  </div>

  <button id="startButton">Spustiť hru</button>
  <canvas id="gameCanvas" width="400" height="600"></canvas>
  <button id="restartButton" style="display:none;">Reštartuj hru</button>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const startButton = document.getElementById('startButton');
    const restartButton = document.getElementById('restartButton');
    const scoreDisplay = document.getElementById('score');
    const livesDisplay = document.getElementById('lives');
    const levelDisplay = document.getElementById('level');
    const nextLevelDisplay = document.getElementById('nextLevel');

    let player, enemies, keys, score, lives, level, gameOver, startTime;
    let gameInterval, lastEnemySpawn = 0;

    const laneCount = 4;
    const laneWidth = canvas.width / laneCount;
    const enemyHeights = 80;
    const levelTimes = [10, 20, 30];
    let levelTimeLimits = [];

    function initGame() {
      player = { lane: 1, y: canvas.height - 100, width: laneWidth - 10, height: 80 };
      enemies = [];
      keys = {};
      score = 0;
      lives = 3;
      level = 1;
      gameOver = false;
      startTime = Date.now();
      lastEnemySpawn = 0;

      let total = 0;
      levelTimeLimits = levelTimes.map(t => total += t);

      scoreDisplay.textContent = "Skóre: 0";
      livesDisplay.textContent = "Životy: 3";
      levelDisplay.textContent = "Úroveň: 1";
      nextLevelDisplay.textContent = "→ za 10s";
    }

    function drawCar(x, y, width, height, color) {
      ctx.fillStyle = 'black';
      ctx.fillRect(x + 4, y + 6, width - 8, 6);
      ctx.fillRect(x + 4, y + height - 14, width - 8, 6);

      ctx.fillStyle = color;
      ctx.fillRect(x, y + 10, width, height - 20);

      ctx.fillStyle = "white";
      ctx.fillRect(x + 10, y + 20, width - 20, 20);
    }

    function update() {
      if (gameOver) return;
      const now = Date.now();
      const elapsed = (now - startTime) / 1000;

      // Úroveň podľa času
      if (elapsed > 60) level = 4;
      else if (elapsed > levelTimeLimits[2]) level = 3;
      else if (elapsed > levelTimeLimits[1]) level = 2;
      else level = 1;

      // Čas do ďalšej úrovne
      let nextTime = level < 4 ? levelTimeLimits[level - 1] : 60;
      nextLevelDisplay.textContent = `→ za ${Math.max(0, Math.ceil(nextTime - elapsed))}s`;

      levelDisplay.textContent = `Úroveň: ${level}`;

      // Ovládanie hráča
      if (keys['ArrowLeft'] && player.lane > 0) player.lane--;
      if (keys['ArrowRight'] && player.lane < laneCount - 1) player.lane++;

      // Spawning nepriateľov
      const spawnRate = 1000 - (level - 1) * 200;
      const count = level === 4 ? 2 : 1;

      if (now - lastEnemySpawn > spawnRate) {
        for (let i = 0; i < count; i++) {
          const lane = Math.floor(Math.random() * laneCount);
          enemies.push({
            lane,
            y: -enemyHeights,
            width: laneWidth - 10,
            height: enemyHeights,
            speed: 2 + level
          });
        }
        lastEnemySpawn = now;
      }

      // Pohyb nepriateľov
      for (let e of enemies) e.y += e.speed;

      // Skóre za prejdené autá
      enemies = enemies.filter(e => {
        if (e.y > canvas.height) {
          score++;
          scoreDisplay.textContent = "Skóre: " + score;
          return false;
        }
        return true;
      });

      // Kontrola kolízií
      for (let e of enemies) {
        if (e.lane === player.lane && e.y + e.height > player.y && e.y < player.y + player.height) {
          lives--;
          livesDisplay.textContent = "Životy: " + lives;
          enemies = enemies.filter(en => en !== e);
          if (lives <= 0) return endGame();
        }
      }

      draw();
      requestAnimationFrame(update);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Cesty / pruhy
      for (let i = 1; i < laneCount; i++) {
        ctx.strokeStyle = "#666";
        ctx.beginPath();
        ctx.moveTo(i * laneWidth, 0);
        ctx.lineTo(i * laneWidth, canvas.height);
        ctx.stroke();
      }

      // Hráč
      drawCar(player.lane * laneWidth + 5, player.y, player.width, player.height, "lime");

      // Nepriatelia
      for (let e of enemies) {
        drawCar(e.lane * laneWidth + 5, e.y, e.width, e.height, "red");
      }
    }

    function endGame() {
      gameOver = true;
      ctx.fillStyle = "white";
      ctx.font = "30px Arial";
      ctx.fillText("Koniec hry!", canvas.width / 2 - 80, canvas.height / 2);
      restartButton.style.display = "inline";
    }

    startButton.onclick = () => {
      startButton.style.display = "none";
      initGame();
      requestAnimationFrame(update);
    };

    restartButton.onclick = () => {
      restartButton.style.display = "none";
      initGame();
      requestAnimationFrame(update);
    };

    document.addEventListener("keydown", e => keys[e.key] = true);
    document.addEventListener("keyup", e => keys[e.key] = false);
  </script>
</body>
</html>
